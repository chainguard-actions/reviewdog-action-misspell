name: Test locale UK setting
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Set up git origin reachable inside the Docker container
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
          rm -rf "$GITHUB_WORKSPACE/.git-remote"
          git init --bare "$GITHUB_WORKSPACE/.git-remote"
          git push "$GITHUB_WORKSPACE/.git-remote" HEAD:refs/heads/act-harness
          git push "$GITHUB_WORKSPACE/.git-remote" --tags
          git remote set-url origin "$GITHUB_WORKSPACE/.git-remote" 2>/dev/null || \
            git remote add origin "$GITHUB_WORKSPACE/.git-remote"

      - name: Create a file with UK spellings
        run: |
          mkdir -p "$GITHUB_WORKSPACE/test-locale"
          cat > "$GITHUB_WORKSPACE/test-locale/uk-spelling.txt" << 'EOF'
          The colour of the organisation is grey.
          The programme was initialised successfully.
          The centre of the neighbourhood is well recognised.
          EOF

      - id: action
        uses: .
        with:
          github_token: ${{ github.token }}
          reporter: local
          locale: UK
          path: ./test-locale
          pattern: '*.txt'
          filter_mode: nofilter
          fail_level: error
          level: error

      - name: Assert action succeeded with UK locale (UK spellings are valid)
        run: |
          echo "Action completed successfully - UK spellings accepted with UK locale"
          echo "PASS"
