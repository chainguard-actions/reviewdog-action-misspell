name: Test pattern and exclude options
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up git origin reachable inside the Docker container
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
          rm -rf "$GITHUB_WORKSPACE/.git-remote"
          git init --bare "$GITHUB_WORKSPACE/.git-remote"
          git push "$GITHUB_WORKSPACE/.git-remote" HEAD:refs/heads/act-harness
          git remote set-url origin "$GITHUB_WORKSPACE/.git-remote" 2>/dev/null || \
            git remote add origin "$GITHUB_WORKSPACE/.git-remote"

      - name: Create test files - one with misspellings (excluded), one clean (included)
        run: |
          mkdir -p "$GITHUB_WORKSPACE/test-pattern/docs"
          mkdir -p "$GITHUB_WORKSPACE/test-pattern/vendor"

          # This file has misspellings but will be excluded via exclude pattern
          cat > "$GITHUB_WORKSPACE/test-pattern/vendor/bad.md" << 'EOF'
          This contians misspeled words that should be exclueded from scanning.
          EOF

          # This file is clean and will be scanned
          cat > "$GITHUB_WORKSPACE/test-pattern/docs/good.md" << 'EOF'
          This file contains correctly spelled words.
          Everything here is spelled correctly.
          EOF

      - id: action
        uses: .
        with:
          github_token: ${{ github.token }}
          path: test-pattern
          pattern: '*.md'
          exclude: '*/vendor/*'
          reporter: local
          filter_mode: nofilter
          fail_level: error
          level: error

      - name: Assert action succeeded (misspelled vendor file was excluded)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded - vendor directory was excluded from scanning"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "FAIL: action failed - vendor directory should have been excluded"
            exit 1
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
