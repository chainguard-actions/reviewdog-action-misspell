name: Test basic usage - no misspellings
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up git origin reachable inside the Docker container
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
          rm -rf "$GITHUB_WORKSPACE/.git-remote"
          git init --bare "$GITHUB_WORKSPACE/.git-remote"
          git push "$GITHUB_WORKSPACE/.git-remote" HEAD:refs/heads/act-harness
          git remote set-url origin "$GITHUB_WORKSPACE/.git-remote" 2>/dev/null || \
            git remote add origin "$GITHUB_WORKSPACE/.git-remote"

      - name: Create a file with correct spelling
        run: |
          mkdir -p "$GITHUB_WORKSPACE/test-content"
          cat > "$GITHUB_WORKSPACE/test-content/correct.txt" << 'EOF'
          This file contains correctly spelled words.
          The quick brown fox jumps over the lazy dog.
          Everything here is spelled correctly.
          EOF

      - id: action
        uses: .
        with:
          github_token: ${{ github.token }}
          path: test-content
          reporter: local
          filter_mode: nofilter
          fail_level: none
          level: error

      - name: Assert action succeeded
        run: |
          echo "Action completed successfully with no misspellings detected"
          echo "PASS"
