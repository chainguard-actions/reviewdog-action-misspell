name: Test basic usage - no misspellings
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          github_token: ${{ github.token }}
          reporter: local
          filter_mode: nofilter
          fail_level: error
          level: error
          path: ./tests/fixtures/correct-spelling
          pattern: '*.md'
        continue-on-error: true

      - name: Assert action ran successfully with no misspellings
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action completed successfully with no misspellings detected"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "FAIL: action failed on a file with correct spelling"
            exit 1
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
