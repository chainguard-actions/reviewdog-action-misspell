name: Test clean files pass with fail_level any
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create clean file
        run: |
          mkdir -p "$GITHUB_WORKSPACE/misspell-target"
          printf 'This sentence has correct language and spelling.\n' > "$GITHUB_WORKSPACE/misspell-target/good.md"
      - id: action
        uses: .
        continue-on-error: true
        with:
          path: misspell-target
          reporter: local
          filter_mode: nofilter
          fail_level: any
      - name: Assert action succeeded
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "success" ]; then
            echo "FAIL: expected success for clean files"
            exit 1
          fi
          echo "PASS"
