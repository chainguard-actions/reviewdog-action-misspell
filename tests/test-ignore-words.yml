name: Test ignore input suppresses misspellings
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          path: tests/fixtures/misspelled
          reporter: local
          filter_mode: nofilter
          fail_level: any
          ignore: recieve,seperate,occured
      - name: Assert action succeeded with ignored words
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "success" ]; then
            echo "FAIL: expected success when all typos are ignored"
            exit 1
          fi
          echo "PASS"
