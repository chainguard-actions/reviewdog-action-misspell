name: Test ignore input - words excluded from misspell check
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Set up git origin reachable inside the Docker container
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
          rm -rf "$GITHUB_WORKSPACE/.git-remote"
          git init --bare "$GITHUB_WORKSPACE/.git-remote"
          git push "$GITHUB_WORKSPACE/.git-remote" HEAD:refs/heads/act-harness
          git push "$GITHUB_WORKSPACE/.git-remote" --tags
          git remote set-url origin "$GITHUB_WORKSPACE/.git-remote" 2>/dev/null || \
            git remote add origin "$GITHUB_WORKSPACE/.git-remote"

      - name: Create a test file with a misspelling that will be ignored
        run: |
          echo "This file contains teh word that is misspeled." > "$GITHUB_WORKSPACE/tests/ignore-test.txt"

      - id: action-with-ignore
        uses: .
        continue-on-error: true
        with:
          github_token: ${{ github.token }}
          reporter: local
          level: info
          filter_mode: nofilter
          fail_level: none
          ignore: 'misspeled,teh'
          path: tests
          pattern: 'ignore-test.txt'

      - name: Assert action ran with ignore list
        env:
          OUTCOME: ${{ steps.action-with-ignore.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action completed successfully with ignore list"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran (failed gracefully)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi

      - name: Cleanup test file
        if: always()
        run: |
          rm -f "$GITHUB_WORKSPACE/tests/ignore-test.txt"
