name: Test ignore words input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Create a file with a misspelling that we will ignore
      - name: Create file with misspelling to be ignored
        run: |
          mkdir -p "$GITHUB_WORKSPACE/test-ignore"
          echo "Determinisitic result is important." > "$GITHUB_WORKSPACE/test-ignore/test.txt"

      - name: Run action with misspelling ignored
        id: action
        uses: .
        with:
          github_token: ${{ github.token }}
          ignore: Determinisitic
          path: test-ignore
          pattern: '*.txt'
          reporter: local
          filter_mode: nofilter
          fail_level: error
          level: error

      - name: Assert ignored misspelling did not cause failure
        run: |
          echo "PASS: ignored word 'Determinisitic' did not cause action to fail"
