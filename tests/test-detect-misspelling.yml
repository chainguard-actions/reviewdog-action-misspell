name: Test misspelling detected with fail_level any
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create file with misspelling
        run: |
          mkdir -p "$GITHUB_WORKSPACE/misspell-target"
          printf 'This sentence has a langauge misspelling.\n' > "$GITHUB_WORKSPACE/misspell-target/bad.md"
      - id: action
        uses: .
        continue-on-error: true
        with:
          path: misspell-target
          reporter: local
          filter_mode: nofilter
          fail_level: any
      - name: Assert action failed due to misspelling
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure because a misspelling exists"
            exit 1
          fi
          echo "PASS"
