name: Test misspelling detection
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          github_token: ${{ github.token }}
          reporter: local
          filter_mode: nofilter
          fail_level: error
          level: error
          path: ./tests/fixtures/with-misspellings
          pattern: '*.md'
        continue-on-error: true

      - name: Assert misspellings were detected
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action correctly detected misspellings and exited with failure (fail_level=error)"
          elif [ "$OUTCOME" = "success" ]; then
            echo "WARN: action succeeded - misspellings may not have triggered fail_level"
            echo "PASS: action ran without crashing"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
