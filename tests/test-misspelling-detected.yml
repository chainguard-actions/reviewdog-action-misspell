name: Test misspelling detection
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up git origin reachable inside the Docker container
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
          rm -rf "$GITHUB_WORKSPACE/.git-remote"
          git init --bare "$GITHUB_WORKSPACE/.git-remote"
          git push "$GITHUB_WORKSPACE/.git-remote" HEAD:refs/heads/act-harness
          git remote set-url origin "$GITHUB_WORKSPACE/.git-remote" 2>/dev/null || \
            git remote add origin "$GITHUB_WORKSPACE/.git-remote"

      - name: Create a file with misspellings
        run: |
          mkdir -p "$GITHUB_WORKSPACE/test-misspell"
          cat > "$GITHUB_WORKSPACE/test-misspell/misspelled.txt" << 'EOF'
          This file contians some misspeled words.
          The recieve function is importent for the applicaiton.
          EOF

      - id: action
        uses: .
        continue-on-error: true
        with:
          github_token: ${{ github.token }}
          path: test-misspell
          reporter: local
          filter_mode: nofilter
          fail_level: error
          level: error

      - name: Assert action detected misspellings and failed
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action correctly failed due to misspellings detected"
          elif [ "$OUTCOME" = "success" ]; then
            echo "FAIL: action should have failed due to misspellings but succeeded"
            exit 1
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
