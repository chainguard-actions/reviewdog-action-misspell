name: Test exclude input skips misspelled files
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          path: tests/fixtures
          exclude: |
            tests/fixtures/misspelled/*
            tests/fixtures/us-english/*
          reporter: local
          filter_mode: nofilter
          fail_level: any
      - name: Assert action succeeded when misspelled files excluded
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "success" ]; then
            echo "FAIL: expected success"
            exit 1
          fi
          echo "PASS"
