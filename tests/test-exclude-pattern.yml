name: Test exclude pattern feature
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          github_token: ${{ github.token }}
          reporter: local
          filter_mode: nofilter
          fail_level: error
          level: error
          path: ./tests/fixtures/exclude-test
          exclude: '*/vendor/*'
        continue-on-error: true

      - name: Assert action ran with vendor directory excluded
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded - vendor directory was excluded, no misspellings found in src"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "FAIL: action failed - vendor exclusion may not have worked, or misspellings found in src"
            exit 1
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
