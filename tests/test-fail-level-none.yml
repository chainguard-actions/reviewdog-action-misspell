name: Test default fail_level none does not fail
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create file with misspelling
        run: |
          mkdir -p "$GITHUB_WORKSPACE/misspell-target"
          printf 'This sentence has a langauge misspelling.\n' > "$GITHUB_WORKSPACE/misspell-target/bad.md"
      - id: action
        uses: .
        with:
          path: misspell-target
          reporter: local
          filter_mode: nofilter
      - name: Assert action succeeded
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "success" ]; then
            echo "FAIL: expected success with fail_level none"
            exit 1
          fi
          echo "PASS"
