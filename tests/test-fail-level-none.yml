name: Test fail_level none - always exits 0
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Create a file with misspellings inside the workspace - but fail_level=none should still exit 0
      - name: Create file with misspellings
        run: |
          mkdir -p "$GITHUB_WORKSPACE/test-fail-level"
          echo "Determinisitic result is important." > "$GITHUB_WORKSPACE/test-fail-level/test.txt"
          echo "This is a seperate issue." >> "$GITHUB_WORKSPACE/test-fail-level/test.txt"

      - name: Run action with fail_level=none (should always succeed)
        id: action
        uses: .
        with:
          github_token: ${{ github.token }}
          path: test-fail-level
          pattern: '*.txt'
          reporter: local
          filter_mode: nofilter
          fail_level: none
          level: error

      - name: Assert action succeeded despite misspellings (fail_level=none)
        run: |
          echo "PASS: action exited 0 with fail_level=none even though misspellings exist"
